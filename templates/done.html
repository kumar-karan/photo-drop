<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Photos Received — Photo Drop</title>
<style>
  :root {{
    --bg: #090a0f;
    --card: rgba(22, 24, 32, 0.85);
    --card-border: rgba(255, 255, 255, 0.08);
    --fg: #f3f4f6;
    --fg-muted: #9ca3af;
    --accent: #22c55e;
    --accent-glow: rgba(34, 197, 94, 0.25);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }}
  * {{ box-sizing: border-box; margin: 0; padding: 0; }}
  body {{
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top, 24px) + 24px) 18px calc(env(safe-area-inset-bottom, 24px) + 24px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }}
  .done-wrap {{
    max-width: 500px;
    width: 100%;
    margin: 0 auto;
    text-align: center;
  }}
  .tick-badge {{
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--accent);
    color: #090a0f;
    display: grid;
    place-items: center;
    margin: 0 auto 16px;
    box-shadow: 0 8px 24px var(--accent-glow);
    animation: pop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }}
  @keyframes pop {{
    0% {{ transform: scale(0.6); opacity: 0; }}
    100% {{ transform: scale(1); opacity: 1; }}
  }}
  h1 {{
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
  }}
  .sub {{
    color: var(--fg-muted);
    font-size: 14.5px;
    line-height: 1.5;
    margin-bottom: 24px;
  }}
  .grid {{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 24px;
    border-radius: 14px;
    overflow: hidden;
  }}
  .grid img {{
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: var(--card);
    display: block;
  }}
  .files-card {{
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(12px);
    border-radius: 14px;
    padding: 6px 14px;
    margin-bottom: 24px;
    text-align: left;
  }}
  ul {{ list-style: none; }}
  li {{
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    font-size: 13.5px;
  }}
  li:last-child {{ border-bottom: none; }}
  li .n {{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }}
  li .s {{ color: var(--fg-muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }}
  .warn {{
    background: rgba(234, 179, 8, 0.12);
    border: 1px solid rgba(234, 179, 8, 0.3);
    color: #fef08a;
    padding: 12px;
    border-radius: 12px;
    font-size: 13px;
    margin-bottom: 20px;
    text-align: left;
  }}
  .actions {{
    display: flex;
    gap: 10px;
  }}
  .btn {{
    flex: 1;
    height: 48px;
    border-radius: 12px;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
  }}
  .btn-primary {{
    background: var(--accent);
    color: #090a0f;
    box-shadow: 0 4px 14px var(--accent-glow);
  }}
</style>
</head>
<body>
<div class="done-wrap">
  <div class="tick-badge">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <h1>Your {count} {noun} {verb} safe</h1>
  <p class="sub">{total} received and stored in original quality on Samsung Galaxy.<br>Google Photos is backing them up now.</p>
  {thumbs}
  <div class="files-card">
    <ul>{rows}</ul>
  </div>
  {warning}
  <div class="actions">
    <a href="/d/{token}/" class="btn btn-primary">Send More Photos</a>
  </div>
</div>
</body></html>
